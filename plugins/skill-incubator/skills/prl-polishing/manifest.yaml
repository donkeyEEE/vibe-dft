name: prl-polishing
version: 6.3.0
description: >
  Declarative manifest for the static/dynamic split. SKILL.md uses this to
  decide which fragments to load for a given polishing request.

always_load:
  - references/paper-writing/write-reader-question-sequence.md
  - references/paper-writing/write-paper-type-taxonomy.md
  - references/paper-writing/write-attribute-intellectual-debt.md
  - references/paper-writing/write-cite-primary-source.md
  - references/paper-writing/write-citation-scope.md
  - references/paper-writing/meta-ai-writing-boundaries.md
  - references/paper-writing/write-terminology-ledger.md
  # Skill-local core
  - static/core/stance.md
  - static/core/prl-argument-logic.md
  - static/core/failure-modes.md
  - static/core/interaction-protocol.md
  - static/core/output-format.md
  - static/core/writing-workspace-protocol.md

axes:
  paper_type:
    detect: |
      Decide what kind of paper or section is being polished. Default to research.
      Use the user's stated framing first; fall back to inference from the text.
    values:
      research:       static/fragments/paper_type/research.md
      methods:        static/fragments/paper_type/methods.md
      hypothesis:     static/fragments/paper_type/hypothesis.md
      algorithmic:    static/fragments/paper_type/algorithmic.md
      review:         static/fragments/paper_type/review.md
    default: research
    multi: false

  section:
    detect: |
      Identify which section(s) the user wants polished. The user may name
      one or several. If unclear, ask before loading. Skip this axis only
      when the user provides standalone prose with no section context.
    values:
      abstract:       static/fragments/section/abstract.md
      intro:          static/fragments/section/intro.md
      results:        static/fragments/section/results.md
      discussion:     static/fragments/section/discussion.md
      conclusion:     static/fragments/section/conclusion.md
      title:          static/fragments/section/title.md
      methods:        static/fragments/section/methods.md
    multi: true

  language:
    detect: |
      Detect the source language of the draft. Use zh-to-en when the draft
      is Chinese or shows strong Chinese-influenced English structure.
      Otherwise use en.
    values:
      en:             static/fragments/language/en.md
      zh-to-en:       static/fragments/language/zh-to-en.md
    default: en
    multi: false

  journal:
    detect: |
      Use the journal value the user names. If the user says "Nature-family"
      generically or names a Nature subjournal, use nature. If they name
      Nature Communications, use nat-comms. Use prl when the user names
      Physical Review Letters or asks for compact PRL letter logic. Because
      this is the PRL skill, default to prl when no journal is named.
    values:
      nature:         static/fragments/journal/nature.md
      nat-comms:      static/fragments/journal/nat-comms.md
      prl:            static/fragments/journal/prl.md
      generic:        static/fragments/journal/generic.md
    default: prl
    multi: false

references:
  on_demand:
    - condition: Physical Review Letters format, evidence logic, reference obligations, or data-availability requirements
      path: references/paper-writing/journal-prl-letter-length.md
    - condition: Physical Review Letters abstract requirements
      path: references/paper-writing/journal-prl-abstract.md
    - condition: Physical Review Letters title requirements
      path: references/paper-writing/journal-prl-title-style.md
    - condition: Physical Review Letters run-in heading requirements
      path: references/paper-writing/journal-prl-run-in-headings.md
    - condition: Physical Review reference obligations
      path: references/paper-writing/journal-physical-review-reference-obligations.md
    - condition: Physical Review data-availability requirements
      path: references/paper-writing/journal-physical-review-data-availability.md
    - condition: PRL claim-evidence-consequence sequencing
      path: references/paper-writing/write-prl-claim-evidence-consequence-sequence.md
    - condition: effective-model assumption boundaries
      path: references/paper-writing/write-prl-effective-model-assumption-boundary.md
    - condition: PRL model-to-validation pairing
      path: references/paper-writing/write-prl-model-to-validation-pairing.md
    - condition: PRL figure prerequisite-signature-consequence logic
      path: references/paper-writing/write-prl-figure-prerequisite-signature-consequence.md
    - condition: PRL quantitative claims and criteria
      path: references/paper-writing/write-prl-quantitative-claim-with-criterion.md
    - condition: PRL main-text and supplement evidence allocation
      path: references/paper-writing/write-prl-main-text-supplement-evidence-allocation.md
    - condition: PRL prediction-condition-observable bridges
      path: references/paper-writing/write-prl-prediction-condition-observable-bridge.md
    - condition: PRL mechanism-control comparators
      path: references/paper-writing/write-prl-mechanism-control-comparator.md
    - condition: PRL computational sensitivity as a result
      path: references/paper-writing/write-prl-computational-sensitivity-as-result.md
    - condition: needs Nature/Nature Communications article-level patterns for abstracts, intros, Results openings, Discussion, conclusions, titles
      path: references/published-article-patterns.md
    - condition: empirical 2025 Nat Commun diction calibration — connector frequencies, the significantly red line, hedge/booster/tense word choices
      path: references/nat-comms-2025-diction.md
    - condition: needs section-specific move orders or phrase patterns
      path: references/section-moves.md
    - condition: needs hedging, transition, evidence, limitation, future-work phrases
      path: references/phrasebank-playbook.md
    - condition: needs academic style, register, article use, or mechanics checks
      path: references/style-guardrails.md
    - condition: needs deeper writing-strategy principles
      path: references/writing-strategy.md
    - condition: needs LaTeX layout/typesetting help (排版) — loose or sparse pages, stranded section headings, figures that don't fill the page or split across pages, "Float too large", multi-panel figure arrangement, or Supplementary Information that looks empty
      path: references/latex-layout.md
